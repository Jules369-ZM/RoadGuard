name: road_guard
description: RoadGuard is a smart and user-friendly mobile application designed to enhance road safety and convenience for drivers in Zambia. The app integrates real-time traffic alerts, license renewal reminders, public safety campaigns, and important notifications from the Road Transport and Safety Agency (RTSA).
version: 1.0.0+3
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  auth_repo:
    path: packages/auth_repo
  bloc: ^8.1.4
  cloud_firestore: ^5.6.5
  connectivity_plus: ^6.1.3
  country_phone_validator: ^1.0.1
  country_pickers: ^3.0.1
  dio: ^5.8.0+1
  equatable: ^2.0.7
  firebase_app_check: ^0.3.2+4
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.6
  firebase_repo:
    path: packages/firebase_repo
  flutter:
    sdk: flutter
  flutter_bloc: any
  flutter_local_notifications: ^19.0.0
  flutter_localizations:
    sdk: flutter
  flutter_native_contact_picker: ^0.0.10
  flutter_svg: ^2.0.17
  font_awesome_flutter: ^10.8.0
  form_inputs:
    path: packages/form_inputs
  formz: ^0.8.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  local_data:
    git:
      url: https://gitlab+deploy-token-4:4zjU2bJymy7c6vTztanf@gitlab.probasegroup.com/flutter_packages/local_data.git
      ref: 25bcb3354fc6171858c62e33d81410192458969f
  net_source:
    path: packages/net_source
  notifications_repo:
    path: packages/notifications_repo
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  permission_client:
    path: packages/permission_client
  pinput: ^5.0.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.3
  webview_flutter_wkwebview: ^3.18.4

dev_dependencies:
  bloc_test: ^9.1.7
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^6.0.0

flutter:
