name: road_guard
description: RoadGuard is a smart and user-friendly mobile application designed to enhance road safety and convenience for drivers in Zambia. The app integrates real-time traffic alerts, license renewal reminders, public safety campaigns, and important notifications from the Road Transport and Safety Agency (RTSA).
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  bloc: ^8.1.4
  flutter:
    sdk: flutter
  flutter_bloc: any
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  local_data:
    git:
      url: https://gitlab+deploy-token-4:4zjU2bJymy7c6vTztanf@gitlab.probasegroup.com/flutter_packages/local_data.git
      ref: 25bcb3354fc6171858c62e33d81410192458969f
  net_source:
    path: packages/net_source

dev_dependencies:
  bloc_test: ^9.1.7
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
